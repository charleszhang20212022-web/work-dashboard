<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 종합 대시보드 · 업무 목록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tasks">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content">

        <!-- 업무 통계 -->
        <div class="grid kpi" id="taskStats"></div>

        <!-- 업무 목록 표 -->
        <div class="section-title">업무 목록 <span class="tag">담당자별 진행 현황</span></div>
        <div class="card">
          <div class="toolbar">
            <div class="filter-group" id="taskFilters"></div>
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.9-3.9"/>
              </svg>
              <input type="text" id="taskSearch" placeholder="업무명 · 담당자 검색">
            </div>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead>
                <tr>
                  <th>ID</th><th>업무명</th><th>담당자</th><th>부서</th>
                  <th>우선순위</th><th>상태</th><th>마감일</th><th>진행률</th>
                </tr>
              </thead>
              <tbody id="taskBody"></tbody>
            </table>
          </div>
        </div>

        <div class="foot">© 2026 오로라 테크놀로지 · 업무 종합 대시보드</div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
