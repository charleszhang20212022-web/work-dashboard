<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 종합 대시보드 · 보고서</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reports">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content">

        <!-- 보고서 요약 통계 -->
        <div class="grid kpi" id="reportStats"></div>

        <!-- 분기별 실적 · 매출 채널 -->
        <div class="section-title">실적 분석</div>
        <div class="grid main-split">
          <div class="card">
            <div class="card-head">
              <div><h3>분기별 실적</h3><div class="desc">매출 · 영업이익 (단위: 억원)</div></div>
            </div>
            <div id="quarterChart"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <div><h3>매출 채널 비중</h3><div class="desc">채널별 매출 구성</div></div>
            </div>
            <div id="channelChart"></div>
          </div>
        </div>

        <!-- 팀별 성과 · 인사이트 -->
        <div class="section-title">팀 성과 · 인사이트</div>
        <div class="grid split">
          <div class="card">
            <div class="card-head">
              <div><h3>팀별 성과</h3><div class="desc">완료 건수 · 정시 완료율 · 종합 평가</div></div>
            </div>
            <div class="table-wrap">
              <table class="data">
                <thead>
                  <tr><th>팀</th><th>완료 업무</th><th>정시 완료율</th><th>평가</th></tr>
                </thead>
                <tbody id="teamBody"></tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <div><h3>핵심 인사이트</h3><div class="desc">데이터 분석 요약</div></div>
            </div>
            <div id="insights"></div>
          </div>
        </div>

        <div class="foot">© 2026 오로라 테크놀로지 · 업무 종합 대시보드</div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
