<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 종합 대시보드 · 프로젝트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar" id="topbar"></header>

      <div class="content">

        <!-- 프로젝트 통계 -->
        <div class="grid kpi" id="projStats"></div>

        <!-- 타임라인 -->
        <div class="section-title">프로젝트 타임라인</div>
        <div class="card">
          <div class="card-head">
            <div>
              <h3>진행 일정</h3>
              <div class="desc">기간 및 진행률 · 막대 색상은 프로젝트 상태(정상 · 주의 · 지연)</div>
            </div>
          </div>
          <div id="gantt"></div>
        </div>

        <!-- 프로젝트 상세 카드 -->
        <div class="section-title">프로젝트 상세 <span class="tag">전체 6건</span></div>
        <div class="grid c3" id="projGrid"></div>

        <div class="foot">© 2026 오로라 테크놀로지 · 업무 종합 대시보드</div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
