<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 업무 종합 대시보드</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">O</div>
      <div>
        <h1>업무 종합 대시보드</h1>
      </div>
    </div>
    <div class="sub">오로라 테크놀로지 · 팀 협업 · 결산 분석 플랫폼</div>

    <div class="login-err" id="err"></div>

    <!-- 구글 로그인 (필수 기능) -->
    <button class="gbtn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.6 17.6 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 6.2-9.6 6.2-17Z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1Z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.1-5.5c-2 1.3-4.6 2.1-7.9 2.1-6.4 0-11.8-4.1-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48Z"/></svg>
      <span>Google 계정으로 로그인</span>
    </button>

    <div class="divider">또는</div>

    <div class="tabs">
      <div class="tab active" data-tab="admin">관리자 로그인</div>
      <div class="tab" data-tab="demo">데모 로그인</div>
    </div>

    <!-- 관리자 로그인 -->
    <form id="adminForm">
      <div class="field">
        <label>아이디</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">관리자로 로그인</button>
      <div class="login-note">기본 계정: <b>admin / admin1234</b> (배포 시 .env 의 ADMIN_USERNAME · ADMIN_PASSWORD 로 변경)</div>
    </form>

    <!-- 데모 로그인 -->
    <div id="demoBox" style="display:none">
      <div class="login-note" style="margin-top:0;margin-bottom:8px">권한별 화면을 바로 체험합니다. (구글 OAuth 미설정 환경에서도 전체 기능 시연 가능)</div>
      <div class="demo-chips">
        <div class="demo-chip" data-id="u1">펑린항 · 관리자</div>
        <div class="demo-chip" data-id="u2">김서연 · 팀장</div>
        <div class="demo-chip" data-id="u4">박지민 · 팀장</div>
        <div class="demo-chip" data-id="u5">최유진 · 팀원</div>
      </div>
    </div>
  </div>
</div>

<script>
  // 에러 메시지
  var params = new URLSearchParams(location.search);
  var e = params.get('e');
  var msg = { google_disabled: 'Google 로그인이 아직 설정되지 않았습니다. 관리자/데모 로그인을 이용하거나 .env 에 GOOGLE_CLIENT_ID/SECRET 를 설정하세요.',
              google_failed: 'Google 로그인에 실패했습니다. 다시 시도해 주세요.' };
  if (e && msg[e]) { var ed = document.getElementById('err'); ed.textContent = msg[e]; ed.classList.add('show'); }

  document.getElementById('googleBtn').onclick = function(){ location.href = '/auth/google'; };

  // 탭 전환
  document.querySelectorAll('.tab').forEach(function(t){
    t.onclick = function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      var isAdmin = t.dataset.tab === 'admin';
      document.getElementById('adminForm').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('demoBox').style.display = isAdmin ? 'none' : 'block';
    };
  });

  // 관리자 로그인
  document.getElementById('adminForm').onsubmit = function(ev){
    ev.preventDefault();
    fetch('/auth/admin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.value, password: password.value })
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){
        if (res.ok) location.href = '/';
        else { var ed=document.getElementById('err'); ed.textContent = res.d.error||'로그인 실패'; ed.classList.add('show'); }
      });
  };

  // 데모 로그인
  document.querySelectorAll('.demo-chip').forEach(function(c){
    c.onclick = function(){
      fetch('/auth/demo', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: c.dataset.id }) })
        .then(function(r){ return r.json(); }).then(function(){ location.href = '/'; });
    };
  });
</script>
</body>
</html>
