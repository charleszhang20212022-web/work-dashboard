<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 종합 대시보드 · 고도화</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <!-- 상단바 -->
    <header class="bar">
      <div class="logo">O</div>
      <div class="title">업무 종합 대시보드<small id="barSub">오로라 테크놀로지</small></div>
      <div class="bar-spacer"></div>
      <div class="chip"><span class="dot"></span>실시간 · <span id="onlineCount">0</span>명 접속</div>
      <div class="chip" id="dateChip"></div>
      <div class="me" id="meBtn">
        <div class="avatar" id="meAvatar" style="width:34px;height:34px;font-size:14px"></div>
        <div><div class="nm" id="meName"></div><div class="rl" id="meRole"></div></div>
      </div>
      <button class="icon-btn" id="logoutBtn" title="로그아웃"></button>
    </header>

    <!-- 카드 덱 (JS 가 12개 카드를 채움) -->
    <div class="deck" id="deck"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastRoot"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
